<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 30px;
            text-align: center;
        }

        nav {
            background: #111827;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Business name or personal introduction</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>About Us</h2>
        <p>
            We provide quality products and services to our customers.
        </p>

        <h2 id="about">Our Services</h2>
        <ul>
            <li>Product sales</li>
            <li>Consulting</li>
            <li>Customer support</li>
        </ul>

        <h2 id="contact">Contact</h2>
        <p>Email: example@email.com</p>
        <p>Phone: +91 98765 43210</p>

        <button onclick="alert('Thank you for contacting us!')">
            Contact Us
        </button>
    </main>

</body>
</html>
